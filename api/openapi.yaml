openapi: 3.0.3
info:
  title: Prepaid Smart Fuel Dispensing API
  version: 2.0.0
  description: >
    Customers hold prepaid wallets. Creating a fuel request reserves funds;
    staff authorize a pump and complete the dispense, which charges the wallet
    from the reserve and releases the unused remainder. Staff can also credit
    customer wallets with cash deposits.
servers:
  - url: http://localhost:4000/api
tags:
  - name: Auth
  - name: Customers
  - name: Wallet
  - name: Fuel
  - name: Stations
  - name: Staff
  - name: Admin
  - name: Devices
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
    AuthResult:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            full_name: { type: string }
            email: { type: string }
            username: { type: string }
            role: { type: string, enum: [customer, staff, admin] }
            station_id: { type: string }
    Wallet:
      type: object
      properties:
        id: { type: string }
        available_balance: { type: string }
        reserved_balance: { type: string }
        currency: { type: string }
        status: { type: string }
    WalletTransaction:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [CASH_DEPOSIT, RESERVATION, RELEASE, FUEL_PAYMENT, REFUND] }
        amount: { type: string }
        balance_before: { type: string }
        balance_after: { type: string }
        reference: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
    FuelType:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price_per_litre: { type: string }
        currency: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    FuelRequest:
      type: object
      properties:
        id: { type: string }
        request_reference: { type: string }
        requested_litres: { type: string }
        requested_amount: { type: string }
        price_per_litre: { type: string, description: Price snapshot taken at creation }
        status: { type: string, enum: [RESERVED, ACCEPTED, AUTHORIZED, COMPLETED, CANCELLED, EXPIRED, REJECTED] }
        expires_at: { type: string, format: date-time }
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login (customer email or staff username)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Access + refresh tokens with user info }
        '401': { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and mint a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: New token pair }
        '401': { description: Invalid or expired refresh token }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: Logged out }
  /customers/register:
    post:
      tags: [Customers]
      summary: Register a customer (wallet is created automatically)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, password]
              properties:
                full_name: { type: string }
                email: { type: string }
                phone: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '201': { description: Created; returns token pair, $ref: '#/components/schemas/AuthResult' }
        '409': { description: Email already registered }
  /wallet:
    get:
      tags: [Wallet]
      summary: Current customer wallet balances
      responses:
        '200': { description: Wallet, $ref: '#/components/schemas/Wallet' }
        '404': { description: Wallet not found }
  /wallet/deposit:
    post:
      tags: [Wallet]
      summary: Cash deposit (ledger CASH_DEPOSIT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number }
                description: { type: string }
      responses:
        '201': { description: Updated wallet + ledger entry }
        '400': { description: Invalid amount }
  /wallet/transactions:
    get:
      tags: [Wallet]
      summary: Paginated ledger history
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Paginated transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
                  total_pages: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WalletTransaction' }
  /stations:
    get:
      tags: [Stations]
      summary: List active stations
      security: []
      responses:
        '200': { description: Station list }
  /stations/{id}/pumps:
    get:
      tags: [Stations]
      summary: Pumps for a station
      security: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Pump list with fuel type }
  /fuel-types:
    get:
      tags: [Stations]
      summary: Active fuel catalogue with prices
      security: []
      responses:
        '200':
          description: Fuel types
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FuelType' }
  /fuel-requests:
    post:
      tags: [Fuel]
      summary: Create a request and reserve wallet funds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [station_id, fuel_type_id, requested_litres]
              properties:
                station_id: { type: string, format: uuid }
                fuel_type_id: { type: string, format: uuid }
                pump_id: { type: string, format: uuid }
                requested_litres: { type: number }
      responses:
        '201': { description: Reserved request, $ref: '#/components/schemas/FuelRequest' }
        '400': { description: Validation failure or insufficient available balance }
    get:
      tags: [Fuel]
      summary: List the current customer's requests
      responses:
        '200': { description: Recent requests }
  /fuel-requests/{id}/cancel:
    post:
      tags: [Fuel]
      summary: Cancel own request and release reserved funds
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancelled request }
        '400': { description: Request not in RESERVED status }
        '403': { description: Not your request }
  /staff/customers:
    get:
      tags: [Staff]
      summary: Search customers by phone (or name/email)
      parameters:
        - { in: query, name: phone, required: true, schema: { type: string }, description: Also accepts `q` }
      responses:
        '200': { description: Matching customers with wallet summary }
        '400': { description: Missing search term }
  /staff/deposits:
    post:
      tags: [Staff]
      summary: Credit a customer's wallet with cash (audited under staff ID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, amount]
              properties:
                user_id: { type: string, format: uuid }
                amount: { type: number, maximum: 10000 }
                description: { type: string }
      responses:
        '201': { description: Deposit confirmation with wallet, entry and customer }
        '404': { description: Customer or wallet not found }
  /staff/pending-requests:
    get:
      tags: [Staff]
      summary: Pending (RESERVED + ACCEPTED) requests at the staff member's station
      responses:
        '200': { description: Pending requests with customer, fuel type and pump }
  /staff/requests/{id}/accept:
    post:
      tags: [Staff]
      summary: Accept a RESERVED request (reservation kept, status ACCEPTED)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Accepted request }
        '400': { description: Wrong status }
        '403': { description: Request belongs to another station }
  /staff/requests/{id}/reject:
    post:
      tags: [Staff]
      summary: Reject a pending request (reservation released, status REJECTED)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Rejected request; funds released }
        '400': { description: Wrong status }
        '403': { description: Request belongs to another station }
  /staff/fuel-requests:
    get:
      tags: [Staff]
      summary: Alias of /staff/pending-requests (backwards compatible)
      responses:
        '200': { description: Pending requests }
  /staff/requests/{id}/assign-pump:
    post:
      tags: [Staff]
      summary: Assign a pump to a request (holds it as RESERVED, no authorization yet)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pump_id]
              properties:
                pump_id: { type: string, format: uuid }
      responses:
        '200': { description: Request with pump assigned }
        '400': { description: Pump unavailable / wrong fuel / wrong status }
        '403': { description: Request belongs to another station }
  /staff/fuel-requests/{id}/authorize:
    post:
      tags: [Staff]
      summary: Authorize dispensing — creates the FuelTransaction with a unique sequential reference (FUEL-YYYYMMDD-NNNNNN)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pump_id: { type: string, format: uuid, description: Overrides/sets the pump in the same step }
      responses:
        '200': { description: Authorized request + transaction ready for the pump controller }
        '400': { description: No pump assignable or wrong status }
        '403': { description: Request belongs to another station }
  /esp32/authorizations/{pump_id}:
    get:
      tags: [Devices]
      summary: Pull endpoint for pump controllers (ESP32) — signed AUTHORIZED transaction for the pump
      security: []
      parameters:
        - { in: path, name: pump_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Authorization payload (or null when nothing pending), signed with HMAC-SHA256 }
        '401': { description: Invalid/missing x-api-key }
        '503': { description: ESP32_API_KEY not configured (endpoint disabled) }
  /esp32/authorizations/{pump_id}/ack:
    post:
      tags: [Devices]
      summary: Controller reports the dispense result — settles the wallet (payment + remainder release)
      security: []
      parameters:
        - { in: path, name: pump_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id, actual_litres]
              properties:
                transaction_id: { type: string }
                actual_litres: { type: number }
                device_signature: { type: string, description: Optional; must equal the signature issued at authorization }
      responses:
        '200': { description: Settlement result }
        '400': { description: Bad litres / signature mismatch / wrong status }
  /staff/fuel-requests/{id}/cancel:
    post:
      tags: [Staff]
      summary: Cancel a RESERVED request at the staff member's station
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancelled }
  /staff/fuel-transactions:
    get:
      tags: [Staff]
      summary: Recent transactions at the staff member's station
      responses:
        '200': { description: Transaction list }
  /staff/fuel-transactions/{id}/complete:
    post:
      tags: [Staff]
      summary: Complete a dispense (charges reserve, releases remainder)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actual_litres]
              properties:
                actual_litres: { type: number }
      responses:
        '200': { description: Completed transaction with final_amount and refund_amount }
        '400': { description: More than authorized, or wrong status }
  /admin/fuel-types:
    get:
      tags: [Admin]
      summary: Full fuel catalogue (admin view, includes inactive)
      responses:
        '200': { description: Fuel types }
    post:
      tags: [Admin]
      summary: Create a fuel type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price_per_litre]
              properties:
                name: { type: string }
                price_per_litre: { type: number }
                currency: { type: string, default: USD }
      responses:
        '201': { description: Created }
        '409': { description: Name already exists }
  /admin/fuel-types/{id}:
    patch:
      tags: [Admin]
      summary: Update name, price, currency or status (live price edits)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                price_per_litre: { type: number }
                currency: { type: string }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '200': { description: Updated fuel type }
    delete:
      tags: [Admin]
      summary: Delete a fuel type (deactivates it when in use)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  deactivated: { type: boolean }
                  message: { type: string }
  /transactions/{id}:
    get:
      tags: [Wallet]
      summary: Full transaction detail incl. receipt URL when completed
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Transaction with receipt_url }
        '403': { description: Not your transaction / another station }
        '404': { description: Not found }
  /stream/pumps/{pump_id}:
    get:
      tags: [Stream]
      summary: SSE — live dispensing telemetry for one pump
      description: >-
        Events: hello, pump_status (device telemetry), pump_transaction
        (authorized transaction snapshot). Customers may only watch a pump
        currently dispensing for them; staff any pump at their station.
      parameters:
        - { in: path, name: pump_id, required: true, schema: { type: string } }
      responses:
        '200': { description: text/event-stream }
        '403': { description: Not allowed to watch this pump }
  /stream/station:
    get:
      tags: [Stream]
      summary: SSE — every pump at the caller's station (staff)
      responses:
        '200': { description: text/event-stream }
  /stream/me:
    get:
      tags: [Stream]
      summary: SSE — customer stream (wallet, requests, dispensing, receipts)
      responses:
        '200': { description: text/event-stream }
        '403': { description: Customer token required }
  /esp32/authorizations/{pump_id}/status:
    post:
      tags: [Device]
      summary: ESP32 periodic telemetry {current_litres, pump_state, error?}
      parameters:
        - { in: path, name: pump_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_litres: { type: number }
                pump_state: { type: string, example: DISPENSING }
                error: { type: string }
      responses:
        '200': { description: '{status: ok}' }
        '404': { description: Pump not found }
  /esp32/authorizations/{pump_id}/completed:
    post:
      tags: [Device]
      summary: ESP32 final report — settles wallet, frees pump, triggers receipt
      parameters:
        - { in: path, name: pump_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actual_litres]
              properties:
                actual_litres: { type: number }
      responses:
        '200': { description: Completed transaction + receipt_url }
        '400': { description: No AUTHORIZED transaction on this pump }
  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Dashboard cards (counts, litres and revenue today, recent audit)
      responses:
        '200': { description: Dashboard summary }
  /admin/users:
    get:
      tags: [Admin]
      summary: Paginated user list with search/status filters
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [ACTIVE, BLOCKED] } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer } }
      responses:
        '200': { description: '{items, page, total_pages, total}' }
  /admin/users/{id}/status:
    patch:
      tags: [Admin]
      summary: Block or unblock an account
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, BLOCKED] }
      responses:
        '200': { description: Updated user }
  /admin/stations:
    get:
      tags: [Admin]
      summary: List stations with pump counts
      responses:
        '200': { description: Station list }
    post:
      tags: [Admin]
      summary: Create a station
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                location: { type: string }
      responses:
        '201': { description: Created }
  /admin/stations/{id}:
    patch:
      tags: [Admin]
      summary: Update station name/location
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
  /admin/pumps:
    get:
      tags: [Admin]
      summary: List pumps (optionally by station)
      parameters:
        - { in: query, name: station_id, schema: { type: string } }
      responses:
        '200': { description: Pump list }
    post:
      tags: [Admin]
      summary: Register a pump controller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [station_id, pump_number, fuel_type_id]
              properties:
                station_id: { type: string }
                pump_number: { type: integer }
                fuel_type_id: { type: string }
                controller_id: { type: string }
      responses:
        '201': { description: Created }
  /admin/pumps/{id}:
    patch:
      tags: [Admin]
      summary: Update pump fuel type / controller / status
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Admin]
      summary: Delete pump (or OFFLINE when history exists)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted or deactivated }
  /admin/staff:
    get:
      tags: [Admin]
      summary: List station staff accounts
      parameters:
        - { in: query, name: station_id, schema: { type: string } }
      responses:
        '200': { description: Staff list }
    post:
      tags: [Admin]
      summary: Create a staff account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [station_id, username, password, role]
              properties:
                station_id: { type: string }
                username: { type: string }
                password: { type: string }
                full_name: { type: string }
                role: { type: string, enum: [ATTENDANT, MANAGER, ADMIN] }
      responses:
        '201': { description: Created }
  /admin/staff/{id}:
    patch:
      tags: [Admin]
      summary: Update staff name/role/status/password
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Paginated audit trail with filters
      parameters:
        - { in: query, name: action, schema: { type: string } }
        - { in: query, name: entity_type, schema: { type: string } }
        - { in: query, name: user_id, schema: { type: string } }
        - { in: query, name: station_id, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer } }
      responses:
        '200': { description: '{items, page, total_pages, total}' }
  /health:
    get:
      tags: [Auth]
      summary: Liveness probe
      security: []
      responses:
        '200': { description: Service health }
