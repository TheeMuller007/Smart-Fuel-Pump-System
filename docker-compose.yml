version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: smart-fuel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smart_fuel_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_fuel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: smart-fuel-backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/smart_fuel_db
      # Secrets must come from the environment/.env — compose only supplies a
      # last-resort dev fallback for JWT so a fresh clone boots; set real ones
      # before any deployment that faces a network.
      - JWT_SECRET=${JWT_SECRET:-dev-only-change-me}
      - PORT=4000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - ESP32_API_KEY=${ESP32_API_KEY:-}
      - DEVICE_SIGNING_SECRET=${DEVICE_SIGNING_SECRET:-}
      - DEVICE_STATION_ID=${DEVICE_STATION_ID:-}
      - STUCK_DISPENSE_TIMEOUT_MIN=${STUCK_DISPENSE_TIMEOUT_MIN:-10}
    volumes:
      # Persist generated receipts across container rebuilds.
      - ./receipts:/usr/src/app/receipts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Python pump-controller mock for testing without hardware.
  # Start with: docker compose --profile mock up
  esp32-mock:
    image: python:3.11-alpine
    profiles: ["mock"]
    working_dir: /app
    volumes:
      - ./esp32-mock:/app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python pump_mock.py --base-url http://backend:4000 --pump-id ${MOCK_PUMP_ID:-00000000-0000-0000-0000-000000000000} --api-key ${ESP32_API_KEY:-dev-key} --signing-secret ${DEVICE_SIGNING_SECRET:-${ESP32_API_KEY:-dev}}"
    environment:
      - ESP32_API_KEY=${ESP32_API_KEY:-}
    depends_on:
      - backend

volumes:
  pgdata:
